name: webdav

services:
  app:
    container_name: webdav
    # Build the image from the Dockerfile in this repository, so stacks
    # deployed straight from Git (e.g. Dockhand) don't need a prebuilt image.
    build:
      context: .
      dockerfile: Dockerfile
    image: 'webdav:local'
    command: ['-c', '/config.yml']
    ports:
      - '6065:6065'
    environment:
      # Optional. Without WEBDAV_PASSWORD, a random password is generated on
      # the first start and printed to the container log.
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-admin}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
    restart: always
    volumes:
      - ./data:/data
      # Holds the generated password. Kept outside ./data so it is not
      # reachable over WebDAV.
      - ./state:/state
      - ./config.yml:/config.yml:ro
