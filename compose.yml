name: webdav

services:
  app:
    container_name: webdav
    # Build the image from the Dockerfile in this repository, so stacks
    # deployed straight from Git (e.g. Dockhand) don't need a prebuilt image.
    build:
      context: .
      dockerfile: Dockerfile
    image: 'webdav:local'
    command: ['-c', '/config.yml']
    ports:
      - '6065:6065'
    environment:
      # Defaults let the first deploy succeed before any variables exist.
      # Change the password: set WEBDAV_PASSWORD in the stack's environment
      # and redeploy.
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-admin}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-changeme}
    restart: always
    volumes:
      - ./data:/data
      - ./config.yml:/config.yml:ro
